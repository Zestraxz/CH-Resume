# Secret scan.
#
# Replaced 2026-10-15 (PC2). The scaffold's version could not parse (job-level `hashFiles()`), and its
# other jobs did not fit: CodeQL and dependency review need GitHub Advanced Security on a private
# repo, and npm/pip audit had only the scaffold's placeholder manifests to audit.
#
# Scope: push and pull_request scan ONLY the new commits (gitleaks-action's own behaviour). A manual
# run (workflow_dispatch) scans the FULL history - use it as an on-demand audit.

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # gitleaks lists a PR's commits through the API

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # read-only token; findings go to the job summary
