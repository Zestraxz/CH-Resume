name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write       # create releases
  packages: write       # push to ghcr.io
  id-token: write       # OIDC for Cosign + SLSA + npm provenance
  attestations: write   # SLSA L3 attestations

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + sign + attest
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for SBOM full history

      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build + push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- SLSA L3 build provenance --------------------------------------
      - name: Attest build provenance (SLSA L3)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/api
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # ---- SBOM (CycloneDX + SPDX both) ----------------------------------
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json
          image: ghcr.io/${{ github.repository }}/api@${{ steps.push.outputs.digest }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom-spdx.json
          image: ghcr.io/${{ github.repository }}/api@${{ steps.push.outputs.digest }}

      - name: Attest SBOMs
        uses: actions/attest-sbom@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/api
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-cyclonedx.json
          push-to-registry: true

      # ---- Cosign keyless signing ----------------------------------------
      - uses: sigstore/cosign-installer@v3
      - name: Sign container with Cosign (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/api@${{ steps.push.outputs.digest }}

      # ---- Attach SBOMs to GH release ------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sbom-cyclonedx.json
            sbom-spdx.json

  npm-publish:
    name: npm publish (with provenance, trusted publishing)
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != '' && !contains(github.repository, 'private')
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Trusted publishing: no NPM_TOKEN needed, npm validates via OIDC.
      - run: npm publish --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: true
