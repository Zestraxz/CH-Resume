# CI for this repo: Markdown docs plus the PowerShell tools the scaffold ships.
#
# Replaced 2026-10-15 (PC2). The scaffold's CI (pnpm lint/typecheck/test, ruff + mypy + pytest,
# docker compose) never ran once here: it put `hashFiles()` in a job-level `if:`, where GitHub does
# not allow it, so every push recorded a 0-job "workflow file issue" failure named by the file path.
# Its Node/Python jobs had nothing real to act on either - the scaffold's placeholder package.json
# has no lockfile, and src/ holds only the template's sample code. Each job below checks files this
# repo owns:
#   workflow-lint - actionlint over .github/workflows (pinned version + checksum).
#   powershell    - every tracked .ps1/.psm1/.psd1 parses under Windows PowerShell 5.1, the runtime
#                   the scripts target (non-ASCII in a BOM-less file breaks 5.1 silently).
#   links         - every repo-relative Markdown link resolves (offline; no network flakiness).
# Rule for edits: never put hashFiles(), secrets or env in a job-level `if:` - they are step-only.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint 1.7.12
        run: |
          tarball=actionlint_1.7.12_linux_amd64.tar.gz
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$tarball"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tarball" | sha256sum -c -
          tar -xzf "$tarball" actionlint
      # Workflow semantics only; self-critic.yml is synced from the Critic kit, so script style
      # findings in it cannot be fixed here without drifting from the kit.
      - run: ./actionlint -color -shellcheck= -pyflakes=

  powershell:
    name: PowerShell parse (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Parse every tracked PowerShell file
        shell: powershell
        run: |
          $bad = 0
          $files = @(git -c core.quotePath=false ls-files '*.ps1' '*.psm1' '*.psd1')
          foreach ($f in $files) {
            $tok = $null; $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $f).Path, [ref]$tok, [ref]$err)
            foreach ($e in $err) { $bad++; Write-Host ("::error file={0},line={1}::{2}" -f $f, $e.Extent.StartLineNumber, $e.Message) }
          }
          Write-Host ("parsed {0} files, {1} parse error(s)" -f $files.Count, $bad)
          if ($bad) { exit 1 }

  links:
    name: Markdown links (repo-relative, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            './**/*.md'
          fail: true
