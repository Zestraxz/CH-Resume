name: AI Cost Report

on:
  pull_request:
    paths:
      - 'apps/api/src/**'
      - 'src/**/*.py'
      - 'evals/**'
      - '.env.example'
  schedule:
    - cron: '0 14 * * MON'  # weekly Mon 14:00 UTC

permissions:
  contents: read
  pull-requests: write

jobs:
  cost-report:
    name: Estimate AI provider spend
    runs-on: ubuntu-latest
    if: vars.LLM_COST_REPORT_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Fetch current spend from proxy
        id: spend
        env:
          LITELLM_PROXY_URL: ${{ vars.LITELLM_PROXY_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          if [ -z "$LITELLM_PROXY_URL" ]; then
            echo "spend=0" >> $GITHUB_OUTPUT
            echo "Skipping - LITELLM_PROXY_URL not set"
            exit 0
          fi
          SPEND=$(curl -fsS "$LITELLM_PROXY_URL/spend/daily" \
            -H "Authorization: Bearer $LITELLM_API_KEY" \
            | jq -r '.total_usd')
          echo "spend=$SPEND" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.spend.outputs.spend != '0'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ai-cost
          message: |
            ## AI cost snapshot

            - **Daily spend so far:** $${{ steps.spend.outputs.spend }}
            - **Daily budget:** ${{ vars.LLM_DAILY_BUDGET_USD }}
            - **% of budget:** check the proxy dashboard

            Cap configured in `.env.example` as `LLM_DAILY_BUDGET_USD`.
            Hitting 80% triggers alerts. 100% returns 429 to callers.
