name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build MkDocs + render Structurizr C4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MkDocs Material + mermaid plugin
        run: pip install mkdocs-material mkdocs-mermaid2-plugin

      - name: Render Structurizr DSL to SVG
        if: hashFiles('docs/architecture/workspace.dsl') != ''
        run: |
          mkdir -p docs/architecture/diagrams
          docker run --rm \
            -v ${{ github.workspace }}/docs/architecture:/usr/local/structurizr \
            structurizr/cli:latest \
            export -workspace /usr/local/structurizr/workspace.dsl \
                   -format mermaid \
                   -output /usr/local/structurizr/diagrams || echo "Structurizr render skipped"

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
