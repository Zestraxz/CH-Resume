# =============================================================================
# Resume — Dev compose
# =============================================================================
# Minimal services for local development. App processes run on the host
# (or as overlay services in docker-compose.prod.yml).
#
# Usage:
#   docker compose up -d
#   docker compose down
#   docker compose logs -f
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_dev_password
      POSTGRES_DB: resume
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resume_user -d resume']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: resume-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: resume_postgres_data
  redis_data:
    name: resume_redis_data
